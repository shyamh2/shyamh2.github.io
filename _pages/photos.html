permalink: /photos/
author_profile: true
---

{% include base_path %}

<style>
.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.photo-grid img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
  cursor: pointer;
  transition: opacity 0.2s;
}
.photo-grid img:hover {
  opacity: 0.85;
}
@media (max-width: 600px) {
  .photo-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

<div class="photo-grid">
  {% assign photos = site.static_files | where_exp: "file", "file.path contains '/images/photos/'" %}
  {% for photo in photos %}
    <a href="{{ photo.path }}" target="_blank">
      <img src="{{ photo.path }}" alt="Photo" loading="lazy">
    </a>
  {% endfor %}
</div>
