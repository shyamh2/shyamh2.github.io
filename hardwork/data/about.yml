# work process
work_process:
  enable : true
  title : "Professional/Personal Interests"
  item:
  - title : "Energy Economics"
    icon : "images/icons/ee.jpg"
    content : "Subdiscipline of ecnomics which studies the exploitation, conversion and use of energy, markets for energy commodities, their regulation and taxation and development. I like reading about this field because I think it is interdisciplinary and can potentially combine natural sciences, engineering and economics. Primarily interested in how we can effectively develop and allocate energy sources to maintain sustained economic growth."

  - title : "High Energy Physics"
    icon : "images/icons/hep.png"
    content : "This branch of physics is concerned with the tiniest building blocks of the universe and studies fascinating questions like how mass/energy are created and why the universe evolved the way it did. I am interested in physics beyond the 'Standard Model' of particle physics and which experiments realise the same. "

  - title : "Football"
    icon : "images/icons/fb.jpg"
    content : "The Beautiful Game. I love football and not a day goes by without playing, thinking or discussing it. My passion for the game has lead to the development of close friendships, a sense of discipline, a never-quit attitude and a feeling of hope and excitement. My absolute dream job is to manage a football club some day. I am a huge supporter of Real Madrid and Manchester United!"
    
  - title : "Drums"
    icon : "images/icons/drums.png"
    content : "I've been playing the drums since 2009 and it represents pure power to me. I feel I can express myself creatively on the kit and always try to come up with a new groove when I practice."
    
  - title : "Photography"
    icon : "images/icons/shyam.png"
    content : "Capturing images is a passion of mine. Going to a particular place alone equipped with just a camera with the aim of finding the perfect shot is a rewarding, challenging and peaceful experience; it's one of the reasons I love to take photographs."